# raptor.conf -- Xiongmai IVG-83X50PSA-B (XM550 + SmartSens SC5332)
#
# What this module needs, measured on M1 and M5 (2026-11-11 to 13). The
# web console (port 8080) edits this file; every key it does not know
# keeps its Raptor default (see Raptor's config/raptor.conf).

[sensor]
name = sc5332
fps = 15
# 50 Hz mains: exposure in whole 10 ms periods (console: off/50/60 Hz)
antiflicker = 1

# The SC5332's clean window is 2576x1936 (VI channel 0 cannot scale), so
# the main stream is that size; the sub stream is VI extended channel 1.
[stream0]
width = 2576
height = 1936
fps = 15
codec = h264
profile = 1
rc_mode = vbr
bitrate = 4000000
gop = 30

[stream1]
enabled = true
width = 640
height = 480
fps = 15
codec = h264
profile = 0
rc_mode = vbr
bitrate = 512000
gop = 30

[jpeg]
quality = 75
fps = 1

# Stream credentials: none in the image. Set them in the web console
# (Streams: RTSP and Snapshots & MJPEG) or leave the streams open; until
# both are set the picture says "UNSECURED - NO PASSWORD SET". They are
# separate from the root login.

[osd]
enabled = true

[osd.timestamp]
type = text
template = %time%
position = top_left
align = left
max_chars = 22

[osd.uptime]
type = text
template = %uptime%
position = top_right
align = right
max_chars = 18

# Day/night. The LED board's photosensor switches only the IR LEDs; the
# IR-cut is pulsed from here: GPIO 1 = filter out (night), GPIO 2 = filter
# in (day). Thresholds are exposure x gain (lines x total gain), measured
# in M5's garage: lit 17-19k, dark with the filter in 409k, IR-lit 18-22k,
# lit with the filter out 7-11k. day_threshold is a third of the darkest
# IR-lit reading, so the IR's own light never flips it back to day, and a
# light switched on at night leaves it in night. Re-measure after a
# re-aim; the console's Day & Night tab has both.
[ircut]
enabled = true
mode = auto
trigger = gain
gpio_ircut = 2
gpio_ircut2 = 1
pulse_ms = 200
hysteresis_sec = 30
night_threshold = 60000
day_threshold = 6000
# LED boards with a light sensor (J4 pin 1) feed it to the SoC's ADC.
# To follow that sensor, so the IR-cut moves with the LEDs, change the
# lines above to trigger = adc and hysteresis_sec = 2, and add
# adc_night = 48, adc_day = 81 and poll_interval_ms = 250. The
# thresholds are the stock firmware's (ric sees 255 - raw: garage lit
# ~125-130, dark 0); hysteresis_sec counts polls, so this switches
# within about half a second of the LEDs. Boards without a sensor stay
# on trigger = gain.

# Motion: rvd's software detection on stream1 (no IVS engine on the
# XM550), rmd for the event. With enabled = true and the [onvif] section
# on, the NVR gets ONVIF motion events (CellMotionDetector, IsMotion);
# restart Raptor and ONVIF to apply. sensitivity 0-4; cooldown_sec is how
# long an event stays on after the last movement.
[motion]
enabled = false
sensitivity = 2
cooldown_sec = 10
record = false
event_file = /tmp/onvif_notify_server/motion_alarm

# ONVIF (onvif_simple_server + WS-Discovery), for NVRs that add cameras
# by ONVIF. Off by default; with enabled = true it starts at boot
# (/etc/init.d/S96onvifserver restart to apply now). It uses the stream
# account from [rtsp] (open while that is unset) and describes the two
# streams above; changes to either reach it on the next request.
[onvif]
enabled = false
port = 80
manufacturer = Xiongmai
model = XM550-Raptor
